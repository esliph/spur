name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # A pinned release, not the apt package: the version decides which
        # codes are reported, and the disable comments must name them.
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version
        env:
          SHELLCHECK_VERSION: 0.11.0
      - name: Lint
        run: shellcheck -s sh spur tests/run.sh tests/lib.sh tests/common.sh tests/bench/*.sh tests/cases/*.sh

  shells:
    name: tests (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [sh, dash, bash]
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y dash
      - name: Run the test suite
        run: SPUR_TEST_SHELL=${{ matrix.shell }} sh tests/run.sh

  awk:
    # The parser is an awk program; mawk alone (Ubuntu's default) is not a
    # matrix. busybox awk runs in the busybox job, BSD awk in the macOS one.
    name: tests (dash, awk ${{ matrix.awk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        awk: [gawk --posix, mawk, original-awk]
    steps:
      - uses: actions/checkout@v4
      - name: Install dash and the awks
        run: sudo apt-get update && sudo apt-get install -y dash gawk mawk original-awk
      - name: Run the test suite
        run: SPUR_TEST_SHELL=dash SPUR_TEST_AWK="${{ matrix.awk }}" sh tests/run.sh

  macos:
    # bash 3.2 as sh, BSD awk, and the BSD dirname and basename.
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        run: sh tests/run.sh

  busybox:
    name: tests (busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite inside Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 \
            sh -c "apk add --no-cache diffutils >/dev/null && sh tests/run.sh"

  bench:
    name: bench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash
      - name: Run every scenario once
        # Keeps the scenarios from rotting; the numbers are not checked.
        run: SPUR_BENCH_ITERATIONS=1 SPUR_TEST_SHELL=dash sh tests/bench/run.sh
